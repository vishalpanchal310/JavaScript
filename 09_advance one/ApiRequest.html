<!-- XMLHttpRequest (XHR) is a JavaScript API used to interact with servers, enabling asynchronous data exchange (AJAX) without reloading the entire web page.
 It supports GET and POST methods to request or send data in formats like XML, JSON, HTML, or plain text.  -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="background-color: #150410; color: azure">
    0 UNSENT Client has been created. open() not called yet. 1 OPENED open() has
    been called. 2 HEADERS_RECEIVED send() has been called, and headers and
    status are available. 3 LOADING Downloading; responseText holds partial
    data. 4 DONE The operation is complete.
  </body>
  <script>
    const requestUrl = "https://api.github.com/users/hiteshchoudhary";
    const xhr = new XMLHttpRequest();
    xhr.open("GET", requestUrl);
    console.log("HERE");
    // console.log(xhr.readyState);
    xhr.onreadystatechange = function () {
      console.log(xhr.readyState);
      if (xhr.readyState === 4) {
        const data = JSON.parse(this.responseText);
        // .parse converts string into JSON
        console.log(typeof data);
        console.log(data.followers);
      }
    };

    xhr.send();
  </script>
</html>
