<!-- //The bind() method is used to permanently bind a function to a specific object and return a new function.
bind() controls what this refers to inside a function. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React</title>
  </head>
  <body>
    <button style="color: rgb(229, 123, 206); align-items: center">
      Button Clicked
    </button>
  </body>
  <script>
    class React {
      constructor() {
        this.library = "React";
        this.server = "https://localhost:300";

        document
          .querySelector("button")
          .addEventListener("click", this.handleClick.bind(this));
      }
      handleClick() {
        console.log("button clicked");
        console.log(this);
      }
    }

    const app = new React();
  </script>
</html>
