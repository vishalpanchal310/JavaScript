  <body style="background-color: black; color: rgb(228, 95, 195)">
    <ul class="language">
      <li>HTML</li>

  <script>
    function addLanguage(langName) {
      const li = document.createElement("li");
      li.innerHTML = `${langName}`;
      document.querySelector(".language").appendChild(li);
    }
    addLanguage("Python");
    addLanguage("Java");
